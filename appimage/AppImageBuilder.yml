# AppImage recipe for the PySide6 production launcher.
# https://appimage-builder.readthedocs.io/en/latest/reference/recipe.html
version: 1

script:
  - rm -rf "$BUILD_DIR" "$TARGET_APPDIR" || true
  - mkdir -p "$BUILD_DIR" "$TARGET_APPDIR"
  - cd "$BUILD_DIR"
  - mkdir -p "$TARGET_APPDIR/usr/src" "$TARGET_APPDIR/usr/share/icons/hicolor/128x128/apps"
  - cp -r "$SOURCE_DIR/../lang" "$SOURCE_DIR/../icons" "$SOURCE_DIR/../gui_qt" "$TARGET_APPDIR/usr/src/"
  - cp "$SOURCE_DIR/../"*.py "$TARGET_APPDIR/usr/src/"
  - cp "$SOURCE_DIR/pickaxe.png" "$TARGET_APPDIR/usr/share/icons/hicolor/128x128/apps/io.github.devilxd.twitchdropsminer.png"

  - python3 -m venv env && ./env/bin/python3 -m pip install pip==26.2.1 wheel==0.47.0
  - PATH="$PWD/env/bin:$PATH" python3 -m pip install --prefix=/usr --root="$TARGET_APPDIR" -r "$SOURCE_DIR/../requirements.txt"
  - python3 -m compileall "$TARGET_APPDIR/usr/src"
  - find "$TARGET_APPDIR" -type f -print0 | xargs -0 file | grep -F 'not stripped' | cut -f1 -d':' | sort -V | xargs -r strip -s -v

AppDir:
  app_info:
    id: io.github.devilxd.twitchdropsminer
    name: Twitch Drops Miner
    icon: io.github.devilxd.twitchdropsminer
    version: "{{APP_VERSION}}"
    exec: usr/bin/python3
    exec_args: "${APPDIR}/usr/src/main.py $@"

  apt:
    arch:
      - "{{ARCH_APT}}"
    sources:
      - sourceline: deb [arch={{ARCH_APT}}] {{APT_REPOSITORY}} jammy main universe
      - sourceline: deb [arch={{ARCH_APT}}] {{APT_REPOSITORY}} jammy-updates main universe
      - sourceline: deb [arch={{ARCH_APT}}] {{APT_REPOSITORY}} jammy-security main universe
        key_url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x871920D1991BC93C
    include:
      # Python 3.10 runtime (interpreter + stdlib) so ${APPDIR}/usr/bin/python3
      # exists and PYTHONHOME=${APPDIR}/usr resolves the standard library.
      - python3
      - python3.10
      - python3.10-minimal
      - libpython3.10-minimal
      - libpython3.10-stdlib
      - libdbus-1-3
      - libegl1
      - libgl1
      - libxkbcommon-x11-0
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-randr0
      - libxcb-render-util0
      - libxcb-shape0
      - libxcb-shm0
      - libxcb-sync1
      - libxcb-xfixes0
      - libxcb-xinerama0
      - libxcb-xkb1
      - libx11-xcb1
      - libfontconfig1
      - libfreetype6
      - libtiff5

  files:
    exclude:
      - etc
      - usr/include
      - usr/share/doc
      - usr/share/man
      - usr/share/themes
      - usr/share/applications
      - usr/sbin

  runtime:
    env:
      PATH: "${APPDIR}/usr/bin:${PATH}"
      PYTHONHOME: "${APPDIR}/usr"
      PYTHONPATH: "${APPDIR}/usr/lib/python3.10/site-packages"

AppImage:
  arch: "{{ARCH}}"
  file_name: Twitch.Drops.Miner-{{ARCH}}.AppImage
  comp: zstd
  sign-key: None
  update-information: guess
