name: Build

on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_private_runtime:
        description: >-
          Request exceptional publication of the private-interface runtime.
          Requires the protected environment and repository opt-in as well.
        required: false
        default: false
        type: boolean

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYINSTALLER_STRICT_UNPACK_MODE: "1"
  PYTHONHASHSEED: "0"
  PYTHON_VERSION: "3.10"

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Validate language files
        run: |
          failed=()
          for file in "lang/"*.json; do
            if err="$(python -m json.tool "${file}" 2>&1 >/dev/null)"; then
              echo "[OK] ${file}"
            else
              echo "[ERROR] ${file} ${err}"
              failed+=("${file}")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo -e "\nFailed to validate the following language file(s): ${failed[*]}"
            exit 1
          fi

      - name: Install Qt system dependencies
        run: |
          sudo apt update
          sudo apt install xvfb libdbus-1-3 libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Resolve release lock metadata in clean CPython 3.10
        run: |
          python -m venv .release-lock-check
          .release-lock-check/bin/python -m pip install \
            --require-hashes --only-binary=:all: \
            -r requirements-bootstrap.txt
          .release-lock-check/bin/python -m pip install \
            --dry-run --ignore-installed \
            --require-hashes --only-binary=:all: \
            -r requirements-release.txt

      - name: Create validation environment and install hash-locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install \
            --require-hashes --only-binary=:all: \
            -r requirements-release.txt
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Compile Python sources
        run: python -m compileall -q *.py build_tools gui_qt tests

      - name: Run Pyright
        run: npx --yes pyright@1.1.409

      - name: Validate locale schemas and placeholders
        run: python -m unittest -v tests.test_translation_schema

      - name: Run Qt regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v

  windows:
    name: Windows
    runs-on: windows-latest
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Set up reproducible build variables
        id: vars
        run: |
          $AppVersion = python -c "from version import __version__; print(__version__)"
          $ShaShort = git rev-parse --short=12 HEAD
          Add-Content $env:GITHUB_OUTPUT "app_version=$AppVersion"
          Add-Content $env:GITHUB_OUTPUT "sha_short=$ShaShort"
          Add-Content $env:GITHUB_OUTPUT "artifact_name=Twitch.Drops.Miner-$AppVersion.$ShaShort-Windows-x86_64"
          Add-Content $env:GITHUB_ENV "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)"

      - name: Append git revision to project version
        env:
          SHA_SHORT: ${{steps.vars.outputs.sha_short}}
        run: |
          (Get-Content version.py) `
          -Replace '^__version__\s*=\s*"[^"]+', "`$0.$env:SHA_SHORT" |`
          Out-File version.py -Encoding utf8

      - name: Validate native release lock in a clean environment
        run: |
          Remove-Item -Recurse -Force .release-lock-check, .release-wheelhouse -ErrorAction SilentlyContinue
          python -m venv .release-lock-check
          $LockPython = (Resolve-Path '.release-lock-check\Scripts\python.exe').Path
          & $LockPython -m pip install --require-hashes --only-binary=:all: -r requirements-bootstrap.txt
          & $LockPython -m pip download --require-hashes --only-binary=:all: --dest .release-wheelhouse -r requirements-release.txt
          & $LockPython -m pip install --dry-run --ignore-installed --require-hashes --only-binary=:all: -r requirements-release.txt
          & $LockPython -m pip install --ignore-installed --no-index --find-links .release-wheelhouse --require-hashes --only-binary=:all: -r requirements-release.txt
          & $LockPython -m pip check
          & $LockPython -c "from keyring.backends.Windows import WinVaultKeyring; from win32ctypes.pywin32 import win32cred; assert WinVaultKeyring.__module__ == 'keyring.backends.Windows'; assert win32cred.__name__"

      - name: Install hash-locked build dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-bootstrap.txt
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt

      - name: Create portable executable
        run: pyinstaller --clean --noconfirm build.spec

      - name: Smoke test frozen executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $Executable = Get-Item 'dist\Twitch Drops Miner (by DevilXD).exe'
          & $Executable.FullName --self-test
          Get-AuthenticodeSignature $Executable.FullName | Format-List Status, StatusMessage, SignerCertificate

      - name: Create normalized release archive
        env:
          ARTIFACT_NAME: ${{steps.vars.outputs.artifact_name}}
        run: |
          python build_tools/package_release.py `
            --output "$env:ARTIFACT_NAME.zip" `
            --entry "dist\Twitch Drops Miner (by DevilXD).exe=Twitch Drops Miner/Twitch Drops Miner (by DevilXD).exe" `
            --entry "manual.txt=Twitch Drops Miner/manual.txt"
          python -m zipfile -t "$env:ARTIFACT_NAME.zip"

      - name: Stage archive-specific runtime SBOM input
        env:
          ARTIFACT_NAME: ${{steps.vars.outputs.artifact_name}}
        run: |
          New-Item -ItemType Directory -Force sbom-input\archive, sbom-input\runtime
          python -m zipfile -e "$env:ARTIFACT_NAME.zip" sbom-input\archive
          Copy-Item requirements-release.txt sbom-input\runtime\requirements.txt

      - name: Generate archive-specific SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: ${{steps.vars.outputs.artifact_name}}.spdx.json
          path: sbom-input
          upload-artifact: false
          upload-release-assets: false

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: ${{steps.vars.outputs.artifact_name}}
          path: |
            ${{steps.vars.outputs.artifact_name}}.zip
            ${{steps.vars.outputs.artifact_name}}.spdx.json
          retention-days: 7

  macos:
    name: macOS (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{matrix.runner}}
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Set up reproducible build variables
        id: vars
        run: |
          app_version="$(python3 -c 'from version import __version__; print(__version__)')"
          sha_short="$(git rev-parse --short=12 HEAD)"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "sha_short=${sha_short}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=Twitch.Drops.Miner-${app_version}.${sha_short}-macOS-${{matrix.arch}}" >> "${GITHUB_OUTPUT}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"

      - name: Append git revision to project version
        env:
          SHA_SHORT: ${{steps.vars.outputs.sha_short}}
        run: sed -i '' -E "s/^(__version__\s*=\s*\"[^\"]+)/\1.${SHA_SHORT}/" version.py

      - name: Validate native release lock in a clean environment
        run: |
          rm -rf .release-lock-check .release-wheelhouse
          python3 -m venv .release-lock-check
          lock_python=".release-lock-check/bin/python"
          "$lock_python" -m pip install --require-hashes --only-binary=:all: -r requirements-bootstrap.txt
          "$lock_python" -m pip download --require-hashes --only-binary=:all: --dest .release-wheelhouse -r requirements-release.txt
          "$lock_python" -m pip install --dry-run --ignore-installed --require-hashes --only-binary=:all: -r requirements-release.txt
          "$lock_python" -m pip install --ignore-installed --no-index --find-links .release-wheelhouse --require-hashes --only-binary=:all: -r requirements-release.txt
          "$lock_python" -m pip check
          "$lock_python" -c "from keyring.backends.macOS import Keyring, api; assert Keyring.__module__ == 'keyring.backends.macOS'; assert api.__name__"

      - name: Install hash-locked build dependencies
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-bootstrap.txt
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt

      - name: Create portable executable
        run: pyinstaller --clean --noconfirm build.spec

      - name: Smoke test and verify application signatures
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          application="dist/Twitch Drops Miner (by DevilXD).app"
          executable="${application}/Contents/MacOS/Twitch Drops Miner (by DevilXD)"
          lipo -archs "$executable" | tr ' ' '\n' | grep -qx '${{matrix.arch}}'
          "$executable" --self-test
          codesign --verify --deep --strict --verbose=2 "$application"
          codesign --display --verbose=4 "$application"

      - name: Create normalized release archive
        env:
          ARTIFACT_NAME: ${{steps.vars.outputs.artifact_name}}
        run: |
          python3 build_tools/package_release.py \
            --output "${ARTIFACT_NAME}.zip" \
            --entry "dist/Twitch Drops Miner (by DevilXD).app=Twitch Drops Miner/Twitch Drops Miner (by DevilXD).app" \
            --entry "manual.txt=Twitch Drops Miner/manual.txt"
          python3 -m zipfile -t "${ARTIFACT_NAME}.zip"

      - name: Stage archive-specific runtime SBOM input
        env:
          ARTIFACT_NAME: ${{steps.vars.outputs.artifact_name}}
        run: |
          mkdir -p sbom-input/archive sbom-input/runtime
          python3 -m zipfile -e "${ARTIFACT_NAME}.zip" sbom-input/archive
          cp requirements-release.txt sbom-input/runtime/requirements.txt

      - name: Generate archive-specific SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: ${{steps.vars.outputs.artifact_name}}.spdx.json
          path: sbom-input
          upload-artifact: false
          upload-release-assets: false

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: ${{steps.vars.outputs.artifact_name}}
          path: |
            ${{steps.vars.outputs.artifact_name}}.zip
            ${{steps.vars.outputs.artifact_name}}.spdx.json
          retention-days: 7

  linux-pyinstaller:
    name: Linux (PyInstaller) (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{matrix.runner}}
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Set up reproducible build variables
        id: vars
        run: |
          app_version="$(python3 -c 'from version import __version__; print(__version__)')"
          sha_short="$(git rev-parse --short=12 HEAD)"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "sha_short=${sha_short}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=Twitch.Drops.Miner-${app_version}.${sha_short}-Linux-PyInstaller-${{matrix.arch}}" >> "${GITHUB_OUTPUT}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"

      - name: Append git revision to project version
        env:
          SHA_SHORT: ${{steps.vars.outputs.sha_short}}
        run: sed -ri "s/^__version__\s*=\s*\"[^\"]+/\0.${SHA_SHORT}/" version.py

      - name: Install Qt system dependencies
        run: |
          sudo apt update
          sudo apt install xvfb libdbus-1-3 libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Validate native release lock in a clean environment
        run: |
          rm -rf .release-lock-check .release-wheelhouse
          python3 -m venv .release-lock-check
          lock_python=".release-lock-check/bin/python"
          "$lock_python" -m pip install --require-hashes --only-binary=:all: -r requirements-bootstrap.txt
          "$lock_python" -m pip download --require-hashes --only-binary=:all: --dest .release-wheelhouse -r requirements-release.txt
          "$lock_python" -m pip install --dry-run --ignore-installed --require-hashes --only-binary=:all: -r requirements-release.txt
          "$lock_python" -m pip install --ignore-installed --no-index --find-links .release-wheelhouse --require-hashes --only-binary=:all: -r requirements-release.txt
          "$lock_python" -m pip check
          "$lock_python" -c "from keyring.backends.SecretService import Keyring; import cffi, cryptography, jeepney, secretstorage; assert Keyring.__module__ == 'keyring.backends.SecretService'"

      - name: Install hash-locked build dependencies
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-bootstrap.txt
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt

      - name: Create portable executable
        run: xvfb-run --auto-servernum pyinstaller --clean --noconfirm build.spec

      - name: Smoke test frozen executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run --auto-servernum "dist/Twitch Drops Miner (by DevilXD)" --self-test

      - name: Show PyInstaller warnings
        run: cat build/build/warn-build.txt || true

      - name: Create normalized release archive
        env:
          ARTIFACT_NAME: ${{steps.vars.outputs.artifact_name}}
        run: |
          python3 build_tools/package_release.py \
            --output "${ARTIFACT_NAME}.zip" \
            --entry "dist/Twitch Drops Miner (by DevilXD)=Twitch Drops Miner/Twitch Drops Miner (by DevilXD)" \
            --entry "manual.txt=Twitch Drops Miner/manual.txt"
          python3 -m zipfile -t "${ARTIFACT_NAME}.zip"

      - name: Stage archive-specific runtime SBOM input
        env:
          ARTIFACT_NAME: ${{steps.vars.outputs.artifact_name}}
        run: |
          mkdir -p sbom-input/archive sbom-input/runtime
          python3 -m zipfile -e "${ARTIFACT_NAME}.zip" sbom-input/archive
          cp requirements-release.txt sbom-input/runtime/requirements.txt

      - name: Generate archive-specific SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: ${{steps.vars.outputs.artifact_name}}.spdx.json
          path: sbom-input
          upload-artifact: false
          upload-release-assets: false

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: ${{steps.vars.outputs.artifact_name}}
          path: |
            ${{steps.vars.outputs.artifact_name}}.zip
            ${{steps.vars.outputs.artifact_name}}.spdx.json
          retention-days: 7

  linux-appimage:
    name: Linux (AppImage) (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{matrix.runner}}
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Set up reproducible build variables
        id: vars
        run: |
          app_version="$(python3 -c 'from version import __version__; print(__version__)')"
          sha_short="$(git rev-parse --short=12 HEAD)"
          echo "app_version=${app_version}" >> "${GITHUB_OUTPUT}"
          echo "sha_short=${sha_short}" >> "${GITHUB_OUTPUT}"
          echo "artifact_name=Twitch.Drops.Miner-${app_version}.${sha_short}-Linux-AppImage-${{matrix.arch}}" >> "${GITHUB_OUTPUT}"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "${GITHUB_ENV}"

      - name: Append git revision to project version
        env:
          SHA_SHORT: ${{steps.vars.outputs.sha_short}}
        run: sed -ri "s/^__version__\s*=\s*\"[^\"]+/\0.${SHA_SHORT}/" version.py

      - name: Install Qt system dependencies
        env:
          FUSE_PACKAGE: ${{matrix.arch == 'x86_64' && 'libfuse2' || 'libfuse2t64'}}
        run: |
          sudo apt update
          sudo apt install libdbus-1-3 libegl1 "${FUSE_PACKAGE}" libgl1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install hash-locked appimage-builder toolchain
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION_FOR_APPIMAGE_BUILDER: "1.1.0.post1"
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r requirements-bootstrap.txt
          python3 -m pip install --require-hashes --no-build-isolation -r requirements-appimage.txt
          rm -rf .release-tools/appimage-builder .release-tools/download
          mkdir -p .release-tools/appimage-builder .release-tools/download
          python3 -m pip download \
            --require-hashes --no-build-isolation --no-deps \
            --dest .release-tools/download \
            -r requirements-appimage-source.txt
          builder_archive="$(find .release-tools/download -type f -name '*.tar.gz' -print -quit)"
          test -n "$builder_archive"
          tar -xzf "$builder_archive" --strip-components=1 -C .release-tools/appimage-builder
          touch .release-tools/appimage-builder/appimagebuilder/modules/setup/apprun_3/helpers/__init__.py
          python3 -m pip install \
            --no-index --no-deps --no-build-isolation \
            .release-tools/appimage-builder
          appimage-builder --version
          python3 -m unittest -v tests.test_appimage_recipe

      - name: Create AppImage
        env:
          ARCH: ${{matrix.arch}}
          ARCH_APT: ${{matrix.arch == 'x86_64' && 'amd64' || 'arm64'}}
          APT_REPOSITORY: ${{matrix.arch == 'x86_64' && 'https://archive.ubuntu.com/ubuntu/' || 'https://ports.ubuntu.com/ubuntu-ports/'}}
          APP_VERSION: ${{steps.vars.outputs.app_version}}.${{steps.vars.outputs.sha_short}}
          PYTHON_VERSION: ${{env.PYTHON_VERSION}}
        run: appimage-builder --recipe appimage/AppImageBuilder.yml

      - name: Smoke test AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          image="$(find . -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$image"
          "$image" --self-test
          "$image" --appimage-extract >/dev/null
          plugin="$(find squashfs-root -path '*/platforms/libqxcb.so' -print -quit)"
          test -n "$plugin"
          runtime_library_path="$(
            find squashfs-root/lib squashfs-root/usr/lib -type d \
              \( -name '*linux-gnu' -o -path '*/PySide6/Qt/lib' \) \
              -print | paste -sd: -
          )"
          test -n "$runtime_library_path"
          dependencies="$(LD_LIBRARY_PATH="$runtime_library_path" ldd "$plugin")"
          printf '%s\n' "$dependencies"
          ! grep -q 'not found' <<< "$dependencies"

      - name: Create normalized release archive
        env:
          ARTIFACT_NAME: ${{steps.vars.outputs.artifact_name}}
        run: |
          image="$(find . -maxdepth 1 -name '*.AppImage' -print -quit)"
          image_name="$(basename "$image")"
          python3 build_tools/package_release.py \
            --output "${ARTIFACT_NAME}.zip" \
            --entry "${image}=Twitch Drops Miner/${image_name}" \
            --entry "manual.txt=Twitch Drops Miner/manual.txt"
          python3 -m zipfile -t "${ARTIFACT_NAME}.zip"

      - name: Stage archive-specific runtime SBOM input
        env:
          ARTIFACT_NAME: ${{steps.vars.outputs.artifact_name}}
        run: |
          mkdir -p sbom-input/archive sbom-input/runtime
          python3 -m zipfile -e "${ARTIFACT_NAME}.zip" sbom-input/archive
          cp requirements-release.txt sbom-input/runtime/requirements.txt

      - name: Generate archive-specific SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          format: spdx-json
          output-file: ${{steps.vars.outputs.artifact_name}}.spdx.json
          path: sbom-input
          upload-artifact: false
          upload-release-assets: false

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: ${{steps.vars.outputs.artifact_name}}
          path: |
            ${{steps.vars.outputs.artifact_name}}.zip
            ${{steps.vars.outputs.artifact_name}}.spdx.json
          retention-days: 7

  prepare_release_validation:
    name: Prepare internal release validation bundle
    needs:
      - windows
      - linux-pyinstaller
      - linux-appimage
      - macos
    runs-on: ubuntu-22.04

    steps:
      - name: Download native archives and archive-specific SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          path: artifacts

      - name: Verify one-to-one archive and runtime SBOM mapping
        run: |
          shopt -s nullglob
          archives=(artifacts/*.zip)
          sboms=(artifacts/*.spdx.json)
          test "${#archives[@]}" -eq 7
          test "${#sboms[@]}" -eq "${#archives[@]}"
          for archive in "${archives[@]}"; do
            sbom="${archive%.zip}.spdx.json"
            test -s "$sbom"
            python3 -m zipfile -t "$archive"
          done
          for sbom in "${sboms[@]}"; do
            test -s "${sbom%.spdx.json}.zip"
          done

      - name: Generate and verify validation checksums
        run: |
          cd artifacts
          export LC_ALL=C
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Upload internal release validation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          compression-level: 0
          if-no-files-found: error
          name: release-validation-${{github.sha}}
          path: artifacts
          retention-days: 7

  publish_release:
    name: Exceptional protected publication
    if: >-
      github.repository == 'PyRo1121/TwitchDropsMiner' &&
      github.ref == 'refs/heads/master' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.publish_private_runtime == true &&
      vars.ENABLE_PRIVATE_RUNTIME_PUBLICATION == 'true'
    needs:
      - prepare_release_validation
    runs-on: ubuntu-22.04
    environment:
      name: private-runtime-publication
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Verify protected-environment publication approval
        env:
          APPROVAL: ${{vars.APPROVE_PRIVATE_RUNTIME_PUBLICATION}}
        run: test "$APPROVAL" = "true"

      - name: Download validated release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-validation-${{github.sha}}
          path: artifacts

      - name: Resolve one-to-one attestation subjects
        id: subjects
        run: |
          record_subject() {
            key="$1"
            pattern="$2"
            mapfile -t matches < <(compgen -G "artifacts/${pattern}" | sort)
            test "${#matches[@]}" -eq 1
            archive="${matches[0]}"
            sbom="${archive%.zip}.spdx.json"
            test -s "$archive"
            test -s "$sbom"
            echo "${key}_archive=${archive}" >> "${GITHUB_OUTPUT}"
            echo "${key}_sbom=${sbom}" >> "${GITHUB_OUTPUT}"
          }
          record_subject windows '*-Windows-x86_64.zip'
          record_subject macos_x86_64 '*-macOS-x86_64.zip'
          record_subject macos_arm64 '*-macOS-arm64.zip'
          record_subject pyinstaller_x86_64 '*-Linux-PyInstaller-x86_64.zip'
          record_subject pyinstaller_aarch64 '*-Linux-PyInstaller-aarch64.zip'
          record_subject appimage_x86_64 '*-Linux-AppImage-x86_64.zip'
          record_subject appimage_aarch64 '*-Linux-AppImage-aarch64.zip'

      - name: Attest release artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/*.zip

      - name: Attest Windows archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{steps.subjects.outputs.windows_sbom}}
          subject-path: ${{steps.subjects.outputs.windows_archive}}

      - name: Attest macOS x86-64 archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{steps.subjects.outputs.macos_x86_64_sbom}}
          subject-path: ${{steps.subjects.outputs.macos_x86_64_archive}}

      - name: Attest macOS arm64 archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{steps.subjects.outputs.macos_arm64_sbom}}
          subject-path: ${{steps.subjects.outputs.macos_arm64_archive}}

      - name: Attest Linux PyInstaller x86-64 archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{steps.subjects.outputs.pyinstaller_x86_64_sbom}}
          subject-path: ${{steps.subjects.outputs.pyinstaller_x86_64_archive}}

      - name: Attest Linux PyInstaller aarch64 archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{steps.subjects.outputs.pyinstaller_aarch64_sbom}}
          subject-path: ${{steps.subjects.outputs.pyinstaller_aarch64_archive}}

      - name: Attest Linux AppImage x86-64 archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{steps.subjects.outputs.appimage_x86_64_sbom}}
          subject-path: ${{steps.subjects.outputs.appimage_x86_64_archive}}

      - name: Attest Linux AppImage aarch64 archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          sbom-path: ${{steps.subjects.outputs.appimage_aarch64_sbom}}
          subject-path: ${{steps.subjects.outputs.appimage_aarch64_archive}}

      - name: Create an immutable policy-exception prerelease
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          cat > release-notes.md <<EOF
          **Exceptional protected publication of the private-interface runtime.**
          This publication required a manual workflow request, repository opt-in,
          and approval through the protected release environment.

          - Reference commit: ${GITHUB_SHA}
          - Verify checksums: \`sha256sum --check SHA256SUMS\`
          - Verify provenance: \`gh attestation verify <artifact> --repo ${GITHUB_REPOSITORY}\`
          - Each ZIP has a same-basename archive-specific SPDX JSON SBOM.
          EOF
          gh release create "dev-build-${GITHUB_SHA}" \
            artifacts/*.zip \
            artifacts/*.spdx.json \
            artifacts/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Development build ${GITHUB_SHA}" \
            --notes-file release-notes.md \
            --prerelease
