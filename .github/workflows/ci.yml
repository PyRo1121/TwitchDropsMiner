name: Build

on:
  push:
    branches:
      - "master"
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  USE_UPX: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Validate language files
        run: |
          failed=()
          for file in "lang/"*.json; do
            if err="$(python -m json.tool "${file}" 2>&1 >/dev/null)"; then
              echo "[OK] ${file}"
            else
              echo "[ERROR] ${file} ${err}"
              failed+=("${file}")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo -e "\nFailed to validate the following language file(s): ${failed[@]}"
            exit 1
          fi

      - name: Install Qt system dependencies
        run: |
          sudo apt update
          sudo apt install xvfb libdbus-1-3 libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libtiff5

      - name: Create validation environment and install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          echo "${PWD}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Compile Python sources
        run: python -m compileall -q *.py gui_qt tests

      - name: Run Pyright
        run: npx --yes pyright@1.1.409

      - name: Validate locale schemas and placeholders
        run: python -m unittest -v tests.test_translation_schema

      - name: Run Qt regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -v

  windows:
    name: Windows
    runs-on: windows-latest
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up variables
        id: vars
        run: |
          Add-Content $env:GITHUB_OUTPUT "sha_short=$(git rev-parse --short HEAD)"

      - name: Append git revision to project version
        env:
          SHA_SHORT: ${{steps.vars.outputs.sha_short}}
        run: |
          (Get-Content version.py) `
          -Replace '^__version__\s*=\s*"[^"]+', "`$0.$env:SHA_SHORT" |`
          Out-File version.py

      # Ensure Python version
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install locked build dependencies
        run: python -m pip install -r requirements-build.txt

      # TODO: Consider using https://github.com/crazy-max/ghaction-upx
      # or some other way of keeping the download link up to date in the future
      - name: Install UPX
        if: env.USE_UPX == 'true'
        run: |
          Invoke-WebRequest -Uri https://github.com/upx/upx/releases/download/v5.0.2/upx-5.0.2-win64.zip -OutFile (Join-Path $env:Temp upx.zip)
          Expand-Archive -LiteralPath (Join-Path $env:Temp upx.zip) -DestinationPath $env:Temp
          Move-Item -Path (Join-Path $env:Temp upx-*) -Destination (Join-Path $env:Temp upx)
          Add-Content $env:GITHUB_PATH (Join-Path $env:Temp upx)

      - name: Create portable executable
        run: |
          pyinstaller --clean --noconfirm build.spec

      - name: Smoke test frozen executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $Executable = Get-ChildItem dist\*.exe | Select-Object -First 1
          & $Executable.FullName --self-test

      - name: Create release folder
        run: |
          $FolderName = 'Twitch Drops Miner'
          New-Item $FolderName -ItemType Directory
          Copy-Item dist\*.exe $FolderName
          Copy-Item manual.txt $FolderName
          Compress-Archive -Path $FolderName -DestinationPath Twitch.Drops.Miner.Windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Windows
          path: Twitch.Drops.Miner.Windows.zip

  macos:
    name: macOS (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{matrix.runner}}
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Append git revision to project version
        env:
          SHA_SHORT: ${{steps.vars.outputs.sha_short}}
        run: |
          sed -i '' -E "s/^(__version__\s*=\s*\"[^\"]+)/\1.${SHA_SHORT}/" version.py

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install locked build dependencies
        run: python3 -m pip install -r requirements-build.txt

      - name: Create portable executable
        run: |
          pyinstaller --clean --noconfirm build.spec

      - name: Smoke test frozen application
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          executable="dist/Twitch Drops Miner (by DevilXD).app/Contents/MacOS/Twitch Drops Miner (by DevilXD)"
          lipo -archs "$executable" | tr ' ' '\n' | grep -qx '${{matrix.arch}}'
          "$executable" --self-test

      - name: Create release folder and Zip
        run: |
          FOLDER="Twitch Drops Miner"
          mkdir -p "$FOLDER"
          cp -r "dist/Twitch Drops Miner (by DevilXD).app" "$FOLDER/"
          cp manual.txt "$FOLDER/"
          zip -r 'Twitch.Drops.Miner.MacOS-${{matrix.arch}}.zip' "$FOLDER"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.MacOS-${{matrix.arch}}
          path: Twitch.Drops.Miner.MacOS-${{matrix.arch}}.zip

  linux-pyinstaller:
    name: Linux (PyInstaller) (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{matrix.runner}}
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Append git revision to project version
        env:
          SHA_SHORT: ${{steps.vars.outputs.sha_short}}
        run: |
          sed -ri "s/^__version__\s*=\s*\"[^\"]+/\0.${SHA_SHORT}/" version.py

      # Ensure Python version
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{env.PYTHON_VERSION}}

      - name: Install Qt system dependencies
        run: |
          sudo apt update
          sudo apt install xvfb libdbus-1-3 libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libtiff5

      - name: Install locked build dependencies
        run: python3 -m pip install -r requirements-build.txt

      - name: Create portable executable
        run: xvfb-run --auto-servernum pyinstaller --clean --noconfirm build.spec

      - name: Smoke test frozen executable
        env:
          QT_QPA_PLATFORM: offscreen
        run: xvfb-run --auto-servernum "dist/Twitch Drops Miner (by DevilXD)" --self-test

      - name: Show PyInstaller warnings
        run: |
          cat build/build/warn-build.txt || true

      - name: Create release folder
        run: |
          folder='Twitch Drops Miner'
          mkdir "${folder}"
          cp manual.txt dist/* "${folder}"
          7z a 'Twitch.Drops.Miner.Linux.PyInstaller-${{matrix.arch}}.zip' "${folder}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Linux.PyInstaller-${{matrix.arch}}
          path: Twitch.Drops.Miner.Linux.PyInstaller-${{matrix.arch}}.zip

  linux-appimage:
    name: Linux (AppImage) (${{matrix.arch}})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{matrix.runner}}
    needs:
      - validate

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up variables
        id: vars
        run: |
          echo "app_version=$(python3 -c 'from version import __version__ as v; print(v)')" >> "${GITHUB_OUTPUT}"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Append git revision to project version
        env:
          SHA_SHORT: ${{steps.vars.outputs.sha_short}}
        run: |
          sed -ri "s/^__version__\s*=\s*\"[^\"]+/\0.${SHA_SHORT}/" version.py

      - name: Install Qt system dependencies
        run: |
          sudo apt update
          sudo apt install libdbus-1-3 libegl1 libfuse2 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libtiff5

      - name: Install locked appimage-builder toolchain
        run: |
          python3 -m pip install \
            pip==26.2.1 wheel==0.47.0 setuptools==83.0.0 setuptools_scm==9.2.2
          python3 -m pip install --no-build-isolation -r requirements-appimage.txt

      - name: Create AppImage
        env:
          ARCH: ${{matrix.arch}}
          ARCH_APT: ${{matrix.arch == 'x86_64' && 'amd64' || 'arm64'}}
          APP_VERSION: ${{steps.vars.outputs.app_version}}.${{steps.vars.outputs.sha_short}}
          PYTHON_VERSION: ${{env.PYTHON_VERSION}}
        run: |
          appimage-builder --recipe appimage/AppImageBuilder.yml

      - name: Smoke test AppImage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          image="$(find . -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$image"
          "$image" --self-test
          "$image" --appimage-extract >/dev/null
          plugin="$(find squashfs-root -path '*/platforms/libqxcb.so' -print -quit)"
          test -n "$plugin"
          ! ldd "$plugin" | grep -q 'not found'

      - name: Create release folder
        run: |
          folder='Twitch Drops Miner'
          mkdir "${folder}"
          cp *.AppImage manual.txt "${folder}"
          7z a 'Twitch.Drops.Miner.Linux.AppImage-${{matrix.arch}}.zip' "${folder}"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          name: Twitch.Drops.Miner.Linux.AppImage-${{matrix.arch}}
          path: Twitch.Drops.Miner.Linux.AppImage-${{matrix.arch}}.zip

  update_releases_page:
    name: Upload builds to Releases
    if: >-
      github.repository == 'PyRo1121/TwitchDropsMiner' &&
      github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request'
    needs:
      - windows
      - linux-pyinstaller
      - linux-appimage
      - macos
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Set up variables
        id: vars
        run: |
          echo "date_now=$(date --rfc-3339=seconds)" >> "${GITHUB_OUTPUT}"

      - name: Download build artifacts from previous jobs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts

      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: artifacts
          format: spdx-json
          output-file: artifacts/Twitch.Drops.Miner.spdx.json
          upload-artifact: false

      - name: Generate artifact checksums
        run: |
          cd artifacts
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest release artifact provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: |
            artifacts/*/*
            artifacts/SHA256SUMS
            artifacts/Twitch.Drops.Miner.spdx.json

      - name: Create an immutable development release
        env:
          GH_TOKEN: ${{github.token}}
          RELEASE_DATE: ${{steps.vars.outputs.date_now}}
        run: |
          cat > release-notes.md <<EOF
          **This is an automatically generated in-development pre-release version of the application, that includes the latest master branch changes.**
          **⚠️ This build is not stable and may end up terminating with a fatal error. ⚠️**
          **Use at your own risk.**

          - Last build date: \`${RELEASE_DATE}\`
          - Reference commit: ${GITHUB_SHA}
          - Verify provenance: \`gh attestation verify <artifact> --repo ${GITHUB_REPOSITORY}\`
          EOF
          gh release create "dev-build-${GITHUB_SHA}" \
            artifacts/*/* \
            artifacts/SHA256SUMS \
            artifacts/Twitch.Drops.Miner.spdx.json \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Development build ${GITHUB_SHA}" \
            --notes-file release-notes.md \
            --prerelease
